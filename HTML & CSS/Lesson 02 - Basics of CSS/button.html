<style>
    .subscribe-button {
        background-color: rgb(198, 26, 26);
        color: white; /* SEt text colour */
        border: none;
        height: 45px;
        width: 105px;
        border-radius: 5px;              /* it will round the corners of the button */
        cursor: pointer;                 /*  when we hover over the button it will make our cursor like a hand*/
        margin-right: 8px;               /* IN CSS space is  margin */
    }

    .join-button {
        background-color: white;
        color: rgb(59, 161, 225);
        border-style: solid;                    /*Make the style of the border a solid color*/
        border-color: rgb(74, 143, 207);
        height: 50px;
        width: 100px;
        border-radius: 5px;
        cursor: pointer;
        
    }


    .tweet-button {
        background-color: rgb(60, 126, 206);
        border: none;
        color: white;
        width: 70px;
        height: 36px;
        border-radius: 18px;
        font-weight: bold;                  /* make the text bold*/
        font-size: 15px;                     /*adjust the text size*/
        cursor: pointer;
        margin-left: 8px;
    }

</style>

<button class = 'subscribe-button'>
    SUBSCRIBE
</button>

<button class = "join-button">
    JOIN 
    </button>

<button class="tweet-button">
    Tweet
</button>
